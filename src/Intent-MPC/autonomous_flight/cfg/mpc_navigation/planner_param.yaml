# 如果你在修改 MPC 参数，请修改这个文件！
rrt/map_resolution: 0.1
rrt/timeout: 0.1
rrt/env_box: [-100, 100, -100, 100, 1.0, 1.0]
rrt/incremental_distance: 0.5
rrt/goal_reach_distance: 0.4
rrt/connect_goal_ratio: 0.2
rrt/max_shortcut_dist: 3
rrt/ignore_unknown: true
rrt/pass_goal_check: true

# A* planner params
astar/use_26_dir: true          # 3D 26邻域
astar/avg_velocity: 1.5         # m/s，用于到达时间估计
astar/w1_dist: 1.0              # 距离代价权重
astar/w2_static: 0.0            # 静态距离场权重（当前未接入距离场，先置0）
astar/w3_dynamic: 50.0          # 动态风险权重（需调用 setDynamicPredictions 才生效），调大以明显避开高风险区域
astar/grid_resolution: 0.1    # A* 内部虚拟栅格分辨率（米），应 >= mapping_param.yaml 中的 map_resolution
astar/w_risk: 50.0              # 风险代价权重（0.0=不使用风险，>0=使用风险，建议10-50，值越大避障越强）
astar/k_risk: 1.0                # 风险转换系数（用于 riskToCostLog）
astar/z_gate: 2.0                # 高度门限（米），高于此高度的风险为0

poly_traj/polynomial_degree: 7
poly_traj/differential_degree: 4
poly_traj/continuity_degree: 3
poly_traj/desired_velocity: 1.0 # this is not used. Will be overwritten.
poly_traj/initial_radius: 0.5
poly_traj/timeout: 0.1
poly_traj/corridor_res: 5.0
poly_traj/shrinking_factor: 0.5
poly_traj/soft_constraint: false
poly_traj/constraint_radius: 0.5
poly_traj/sample_delta_time: 0.1
poly_traj/maximum_iteration_num: 10
poly_traj/use_pwl_failsafe: true

mpc_planner/horizon: 30
mpc_planner/z_range_min: 1.0
mpc_planner/z_range_max: 2.9 
mpc_planner/static_safety_dist: 0.8
mpc_planner/dynamic_safety_dist: 0.6
mpc_planner/static_constraint_slack_ratio: 0.01
mpc_planner/dynamic_constraint_slack_ratio: 0.2

# ========== 风险自适应椭球参数 ==========
# 🚨 紧急禁用：如果遇到倒退、崩溃或椭球过大问题，将下面改为 false
# 启用/禁用风险自适应椭球（true=启用，false=使用原始固定椭球）
mpc_planner/use_risk_adaptive: true

# 风险裕量计算参数：s = clip(s0 + alpha*vc + beta*exp(-ttc/tau), s_min, s_max)
mpc_planner/risk_s0: 0.10          # 基线膨胀量 (m)，静态风险（降低以防过大）
mpc_planner/risk_alpha: 0.25       # closing speed 系数（无量纲），降低以防过大
mpc_planner/risk_beta: 0.4         # TTC 指数项系数 (m)，降低以防过大
mpc_planner/risk_tau: 2.0          # TTC 衰减时间常数 (s)，增大使反应更缓和
mpc_planner/risk_s_min: 0.0        # 最小膨胀量 (m)，远距离或远离时的最小值
mpc_planner/risk_s_max: 0.8        # 最大膨胀量 (m)，降低到0.8防止椭球过大

# 各向异性参数（椭球朝向和形状）
mpc_planner/risk_kappa: 0.20       # 各向异性强度 [0,1)，降低以防变形过大（建议 0.2-0.5）
mpc_planner/risk_vel_threshold: 0.15  # 低速阈值 (m/s)，低于此速度时退化成圆形，避免抖动

# ========== 稳定性补丁参数 ==========
# 这些参数用于平滑椭球参数的时间变化，防止 QP 不可行或轨迹抖动
mpc_planner/risk_time_const_s: 0.8     # s 的时间常数 (s)，增大以让变化更平滑
mpc_planner/risk_time_const_phi: 0.8   # phi 的时间常数 (s)，增大以让变化更平滑
mpc_planner/risk_max_delta_s: 0.2      # s 的最大变化率 (m/step)，降低以防突变
mpc_planner/risk_max_delta_phi: 20.0   # phi 的最大变化率 (deg/step)，降低以防突变 
# MPC clustering params
mpc_planner/cloud_res: 0.2
mpc_planner/local_cloud_region_x: 6.0 # forward
mpc_planner/local_cloud_region_y: 4.0 # left and right
mpc_planner/ground_height: 0.5
mpc_planner/ceiling_height: 3.0